# Example workflow for the Veil GitHub Action. Copy it to .github/workflows/veil.yml in your repo.
# Pin the Action to a full version tag, such as v1.0.0, or to a commit SHA when you copy it.
name: veil

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # To start a run from Jira, send a repository_dispatch event, then add it here:
  # repository_dispatch:
  #   types: [veil-run]
  # To run on a pull request, add the trigger below and set pull_request_enabled: true
  # in .gozu/jira-to-pr.yml. The run sees only the tickets of the branch of that PR.
  # A pull request from a fork never runs. Gozu must write the tickets before the run starts.
  # pull_request:
  #   types: [opened, reopened]
  # Never use pull_request_target. It gives secrets to code from a fork.

permissions:
  contents: write
  pull-requests: write

# One run for each repo. An event during a run makes one more run after it.
concurrency:
  group: veil-${{ github.repository }}
  cancel-in-progress: false

jobs:
  veil:
    # Never start on a Fix branch of veil. This saves the minutes of the runner.
    if: ${{ !startsWith(github.head_ref, 'gozu/fix-') && !startsWith(github.ref_name, 'gozu/fix-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Wasi-cal/veil@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
