# Settings for the trial. Copy it to .gozu/jira-to-pr.yml in Wasi-cal/Odyssey-port6-RAG.
jira_site_url: "https://gozu-calfus.atlassian.net"
jira_project_keys: ["VT"]
# A low cap keeps each ticket cheap in the first run.
ticket_token_cap: 30000
# The VT workflow has only To Do, In Progress and Done. It has no In Review status.
in_review_status: "In Progress"
# No label is needed. veil takes every open ticket without an assignee.
eligible_label: ""
