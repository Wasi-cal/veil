[project]
name = "veil"
version = "0.1.0"
description = "Agent that fixes Gozu Tickets and opens draft Fix PRs for human review."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6",
    "redis>=5.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
service = [
    "temporalio>=1.32,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "import-linter>=2.0",
    "temporalio>=1.32,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.importlinter]
root_package = "veil"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "engine imports nothing from adapters or shells"
type = "forbidden"
source_modules = ["veil.engine"]
forbidden_modules = ["veil.adapters", "veil.shells"]

[[tool.importlinter.contracts]]
name = "engine folders import only from the folders below them"
type = "layers"
layers = [
  "veil.engine.run",
  "veil.engine.fix | veil.engine.eligibility | veil.engine.grouping",
  "veil.engine.tools | veil.engine.context",
  "veil.engine.workspace | veil.engine.secrets | veil.engine.config",
  "veil.engine.interfaces",
  "veil.engine.models",
  "veil.engine.errors | veil.engine.constants",
]

[[tool.importlinter.contracts]]
name = "github adapter folders import only from the folders below them"
type = "layers"
layers = [
  "veil.adapters.github.provider",
  "veil.adapters.github.http_api | veil.adapters.github.workspace | veil.adapters.github.app_token",
  "veil.adapters.github.git_command | veil.adapters.github.api | veil.adapters.github.token_source",
  "veil.adapters.github.models",
  "veil.adapters.github.constants",
]

[[tool.importlinter.contracts]]
name = "jira adapter folders import only from the folders below them"
type = "layers"
layers = [
  "veil.adapters.jira.tracker | veil.adapters.jira.gateway",
  "veil.adapters.jira.http_client | veil.adapters.jira.issue_parser",
  "veil.adapters.jira.adf",
  "veil.adapters.jira.models",
  "veil.adapters.jira.constants",
]

[[tool.importlinter.contracts]]
name = "shared adapter code imports no adapter"
type = "forbidden"
source_modules = [
  "veil.adapters.json_http",
  "veil.adapters.no_redirect",
  "veil.adapters.yaml_settings",
  "veil.adapters.constants",
]
forbidden_modules = [
  "veil.adapters.github",
  "veil.adapters.jira",
  "veil.adapters.openai",
]

[[tool.importlinter.contracts]]
name = "openai adapter folders import only from the folders below them"
type = "layers"
layers = [
  "veil.adapters.openai.client | veil.adapters.openai.http_api",
  "veil.adapters.openai.api",
  "veil.adapters.openai.models",
  "veil.adapters.openai.constants",
]

[[tool.importlinter.contracts]]
name = "postgres adapter folders import only from the folders below them"
type = "layers"
layers = [
  "veil.adapters.postgres.store | veil.adapters.postgres.migrate",
  "veil.adapters.postgres.migrations",
  "veil.adapters.postgres.models",
  "veil.adapters.postgres.orm",
  "veil.adapters.postgres.constants",
]

[[tool.importlinter.contracts]]
name = "redis adapter folders import only from the folders below them"
type = "layers"
layers = [
  "veil.adapters.redis.settings_cache | veil.adapters.redis.jira_cache | veil.adapters.redis.repo_list_cache | veil.adapters.redis.rate_limiter",
  "veil.adapters.redis.snapshot_source | veil.adapters.redis.guarded_redis | veil.adapters.redis.cache_keys",
  "veil.adapters.redis.constants",
]

[[tool.importlinter.contracts]]
name = "the redis adapter uses no other adapter except the snapshot model"
type = "forbidden"
source_modules = ["veil.adapters.redis"]
forbidden_modules = [
  "veil.adapters.github",
  "veil.adapters.jira",
  "veil.adapters.openai",
  "veil.adapters.postgres.store",
  "veil.adapters.postgres.orm",
  "veil.adapters.postgres.migrate",
  "veil.adapters.postgres.migrations",
  "veil.adapters.postgres.constants",
]

[[tool.importlinter.contracts]]
name = "no adapter uses the redis adapter, so a cache stays a choice of the Shell"
type = "forbidden"
source_modules = [
  "veil.adapters.github",
  "veil.adapters.jira",
  "veil.adapters.openai",
  "veil.adapters.postgres",
]
forbidden_modules = ["veil.adapters.redis"]

[[tool.importlinter.contracts]]
name = "github action shell folders import only from the folders below them"
type = "layers"
layers = [
  "veil.shells.github_action.main",
  "veil.shells.github_action.run_action",
  "veil.shells.github_action.credentials | veil.shells.github_action.environment | veil.shells.github_action.masking | veil.shells.github_action.summary | veil.shells.github_action.triggers",
  "veil.shells.github_action.models",
  "veil.shells.github_action.errors",
  "veil.shells.github_action.constants",
]

[[tool.importlinter.contracts]]
name = "service shell folders import only from the folders below them"
type = "layers"
layers = [
  "veil.shells.service.temporal",
  "veil.shells.service.run_repo",
  "veil.shells.service.classify_failure | veil.shells.service.checkout_sweep",
  "veil.shells.service.errors | veil.shells.service.models",
  "veil.shells.service.constants",
]

[[tool.importlinter.contracts]]
name = "temporal folders of the service import only from the folders below them"
type = "layers"
layers = [
  "veil.shells.service.temporal.client | veil.shells.service.temporal.worker",
  "veil.shells.service.temporal.workflow | veil.shells.service.temporal.activities",
  "veil.shells.service.temporal.workflow_id | veil.shells.service.temporal.models",
  "veil.shells.service.temporal.constants",
]

[[tool.importlinter.contracts]]
name = "shared shell code imports no shell"
type = "forbidden"
source_modules = ["veil.shells.shared"]
forbidden_modules = ["veil.shells.github_action", "veil.shells.service"]

[[tool.importlinter.contracts]]
name = "no shell uses another shell"
type = "independence"
modules = ["veil.shells.github_action", "veil.shells.service"]

[[tool.importlinter.contracts]]
name = "only the temporal folder of the service imports temporalio"
type = "forbidden"
source_modules = [
  "veil.engine",
  "veil.adapters",
  "veil.shells.shared",
  "veil.shells.github_action",
  "veil.shells.service",
]
forbidden_modules = ["temporalio"]
ignore_imports = [
  "veil.shells.service.temporal.** -> temporalio",
  "veil.shells.service.temporal.** -> temporalio.**",
]
unmatched_ignore_imports_alerting = "none"
