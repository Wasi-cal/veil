[project]
name = "veil"
version = "0.1.0"
description = "Agent that fixes Gozu Tickets and opens draft Fix PRs for human review."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.importlinter]
root_package = "veil"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "engine imports nothing from adapters or shells"
type = "forbidden"
source_modules = ["veil.engine"]
forbidden_modules = ["veil.adapters", "veil.shells"]

[[tool.importlinter.contracts]]
name = "engine folders import only from the folders below them"
type = "layers"
layers = [
  "veil.engine.run",
  "veil.engine.fix | veil.engine.eligibility | veil.engine.grouping",
  "veil.engine.tools | veil.engine.context",
  "veil.engine.workspace | veil.engine.secrets | veil.engine.config",
  "veil.engine.interfaces",
  "veil.engine.models",
  "veil.engine.errors | veil.engine.constants",
]

[[tool.importlinter.contracts]]
name = "github adapter folders import only from the folders below them"
type = "layers"
layers = [
  "veil.adapters.github.provider",
  "veil.adapters.github.http_api | veil.adapters.github.workspace | veil.adapters.github.app_token",
  "veil.adapters.github.git_command | veil.adapters.github.api | veil.adapters.github.token_source",
  "veil.adapters.github.models",
  "veil.adapters.github.constants",
]

[[tool.importlinter.contracts]]
name = "jira adapter folders import only from the folders below them"
type = "layers"
layers = [
  "veil.adapters.jira.tracker | veil.adapters.jira.gateway",
  "veil.adapters.jira.http_client | veil.adapters.jira.issue_parser",
  "veil.adapters.jira.adf",
  "veil.adapters.jira.models",
  "veil.adapters.jira.constants",
]

[[tool.importlinter.contracts]]
name = "shared adapter code imports no adapter"
type = "forbidden"
source_modules = [
  "veil.adapters.json_http",
  "veil.adapters.no_redirect",
  "veil.adapters.yaml_settings",
  "veil.adapters.constants",
]
forbidden_modules = [
  "veil.adapters.github",
  "veil.adapters.jira",
  "veil.adapters.openai",
]

[[tool.importlinter.contracts]]
name = "openai adapter folders import only from the folders below them"
type = "layers"
layers = [
  "veil.adapters.openai.client | veil.adapters.openai.http_api",
  "veil.adapters.openai.api",
  "veil.adapters.openai.models",
  "veil.adapters.openai.constants",
]

[[tool.importlinter.contracts]]
name = "github action shell folders import only from the folders below them"
type = "layers"
layers = [
  "veil.shells.github_action.main",
  "veil.shells.github_action.run_action",
  "veil.shells.github_action.credentials | veil.shells.github_action.environment | veil.shells.github_action.masking | veil.shells.github_action.summary | veil.shells.github_action.triggers",
  "veil.shells.github_action.models",
  "veil.shells.github_action.errors",
  "veil.shells.github_action.constants",
]

[[tool.importlinter.contracts]]
name = "shared shell code imports no shell"
type = "forbidden"
source_modules = ["veil.shells.shared"]
forbidden_modules = ["veil.shells.github_action"]
