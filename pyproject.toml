[project]
name = "veil"
version = "0.1.0"
description = "Agent that fixes Gozu Tickets and opens draft Fix PRs for human review."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "import-linter>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.importlinter]
root_package = "veil"

[[tool.importlinter.contracts]]
name = "engine imports nothing from adapters or shells"
type = "forbidden"
source_modules = ["veil.engine"]
forbidden_modules = ["veil.adapters", "veil.shells"]

[[tool.importlinter.contracts]]
name = "engine folders import only from the folders below them"
type = "layers"
layers = [
  "veil.engine.run",
  "veil.engine.fix | veil.engine.eligibility",
  "veil.engine.tools | veil.engine.context",
  "veil.engine.workspace",
  "veil.engine.interfaces",
  "veil.engine.models",
  "veil.engine.errors | veil.engine.constants",
]
